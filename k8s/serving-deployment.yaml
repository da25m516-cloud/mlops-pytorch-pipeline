apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar10-serving
  namespace: ml-training
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cifar10-serving
  template:
    metadata:
      labels:
        app: cifar10-serving
    spec:
      containers:
        - name: server
          image: mlops-pytorch-serve:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL_CHECKPOINT
              value: /app/checkpoints/classifier_v1.pt
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: model-storage
              mountPath: /app/checkpoints
              subPath: checkpoints
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: training-storage

